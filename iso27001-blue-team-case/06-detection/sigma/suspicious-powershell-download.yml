title: Suspicious PowerShell Download-Related Command Line
id: 9ce6f1bb-0e7f-4ec4-8b33-8f1a31d4c201
status: test
description: >-
  Identifies PowerShell process creation with command-line strings often associated
  with downloading remote content. This is a triage signal, not proof of malware.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Portfolio lab - illustrative rule
date: 2026-10-24
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - '\\powershell.exe'
      - '\\pwsh.exe'
  selection_command:
    CommandLine|contains:
      - 'DownloadString'
      - 'Invoke-WebRequest'
      - 'iwr '
      - 'WebClient'
  condition: selection_image and selection_command
falsepositives:
  - Authorized administration or software deployment scripts
  - Legitimate automation using PowerShell to download artifacts
level: medium
tags:
  - attack.execution
  - attack.t1059.001
