title: PowerShell Encoded Command
author: Portfolio lab - illustrative rule
id: 2b1e3c44-9e0c-4a2a-a2c6-5a7b7b2e11d1
status: test
description: Detects PowerShell command lines containing common encoded-command flags; this is a triage signal.
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - '\\powershell.exe'
      - '\\pwsh.exe'
  selection_flag:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
  condition: selection_image and selection_flag
falsepositives:
  - Authorized automation
  - Administration scripts
level: medium
tags:
  - attack.execution
  - attack.t1059.001
