name: Validate ISO 27001 Blue Team case

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate repository
        run: python iso27001-blue-team-case/scripts/validate_repo.py
